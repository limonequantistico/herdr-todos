id = "herdr-todos"
name = "todos"
version = "0.6.0"
min_herdr_version = "0.7.5"
platforms = ["macos", "linux"]
description = "Todo lists from a TODOS.md file, in a small side panel: drag to reorder, click to tick."

# Builds the panel on `herdr plugin install` (needs a Rust toolchain). `herdr plugin link`
# skips this: for a local checkout, run `cargo build --release` yourself.
# An open panel notices the new binary and restarts itself on it, in place, keeping undo,
# selection, theme and collapsed lists. A GitHub reinstall replaces the binary at the same
# path, so `herdr plugin install` again is how users update.
[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[panes]]
id = "panel"
title = "todos"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-todos\""]

# Bind it in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "prefix+t"
#   type = "plugin_action"
#   command = "herdr-todos.toggle"
[[actions]]
id = "toggle"
title = "todos: toggle panel"
contexts = ["pane", "workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-todos\" toggle"]
